spring:
  application:
    name: pos-api

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/shreespark_pos
    username: postgres
    password: sid3136
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: change-this-to-a-very-long-secret-key-at-least-256-bits-long
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  upload:
    dir: uploads/images
    max-file-size: 5MB
    allowed-types: image/jpeg,image/png,image/webp

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  use-management-port: false
  cache:
    disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
